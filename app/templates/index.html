<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpsBot — Autonomous SRE Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col justify-between font-sans">

    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="h-3 w-3 bg-emerald-500 rounded-full animate-pulse"></div>
            <h1 class="text-lg font-bold tracking-wide">🤖 OpsBot <span class="text-xs font-normal text-slate-400">v1.0 SRE Assistant</span></h1>
        </div>
        <div class="text-xs bg-slate-800 px-3 py-1 rounded-full text-emerald-400 border border-slate-700">
            Status: Nominal
        </div>
    </header>

    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
        <div class="flex items-start space-x-3">
            <div class="bg-indigo-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm shrink-0">AI</div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 max-w-xl text-sm shadow">
                Hello! I am your <strong>OpsBot SRE Assistant</strong>. How can I help you monitor or troubleshoot your infrastructure today? Try asking: <em>"What is the system status?"</em> or <em>"Show metrics"</em>.
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 p-4">
        <form id="chat-form" class="max-w-3xl mx-auto flex gap-3">
            <input type="text" id="user-input" placeholder="Ask OpsBot a question about your infrastructure..." 
                   class="flex-1 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 bg-slate-900 text-white" autocomplete="off" required>
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl font-medium text-sm transition shadow-lg">
                Send
            </button>
        </form>
    </footer>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = userInput.value.trim();
            if (!query) return;

            appendMessage(query, 'user');
            userInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                const data = await res.json();
                appendMessage(data.response, 'bot');
            } catch (err) {
                appendMessage("⚠️ Error communicating with OpsBot core engine.", 'bot');
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });

        function appendMessage(text, sender) {
            const isUser = sender === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start space-x-3 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;

            const avatar = document.createElement('div');
            avatar.className = `${isUser ? 'bg-emerald-600' : 'bg-indigo-600'} text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm shrink-0`;
            avatar.innerText = isUser ? 'YOU' : 'AI';

            const bubble = document.createElement('div');
            bubble.className = `${isUser ? 'bg-indigo-950 border-indigo-800' : 'bg-slate-900 border-slate-800'} border rounded-2xl p-4 max-w-xl text-sm shadow leading-relaxed`;
            bubble.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code class="bg-slate-950 px-1 py-0.5 rounded text-indigo-300">$1</code>');

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            chatContainer.appendChild(wrapper);
        }
    </script>
</body>
</html>
